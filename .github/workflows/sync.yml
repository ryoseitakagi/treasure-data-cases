name: Sync Treasure AI cases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasure-case-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install sync dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch official pages and build the site
        run: |
          python scripts/sync_cases.py
          python scripts/build_site.py

      - name: Commit changed case data
        run: |
          if git diff --quiet; then
            echo "No case-site changes detected."
            exit 0
          fi
          git config user.name "treasure-cases-sync[bot]"
          git config user.email "treasure-cases-sync[bot]@users.noreply.github.com"
          git add data/cases.json index.html
          git commit -m "chore: sync Treasure AI cases"
          git push
